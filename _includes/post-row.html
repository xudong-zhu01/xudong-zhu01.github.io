          <li class="entry-row">
            <span class="entry-aside sf-text">
              {% unless include.nodate %}<time datetime="{{ include.post.date | date: '%Y-%m-%d' }}">{{ include.post.date | date: "%-d %b %Y" }}</time>{% endunless %}
              <span class="entry-lang">{% if include.post.lang contains "zh" %}中文{% else %}English{% endif %}</span>
            </span>
            <a class="entry-link sf-display" href="{{ include.post.url | relative_url }}"{% if include.post.lang %} lang="{{ include.post.lang }}"{% endif %}>{{ include.post.title }}</a>
          </li>
